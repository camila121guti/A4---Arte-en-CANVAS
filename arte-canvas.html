<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Arte en Canvas | Exposición Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --font-title: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: var(--font-title);
            color: var(--gold);
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .canvas-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        canvas {
            background-color: #050505;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: block;
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 22px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background-color: var(--gold);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>A4 ARTE EN CANVAS</h1>
        <p class="subtitle">Composición Geométrica Estructurada & Animación en Tiempo Real</p>
    </header>

    <main class="canvas-container">
        <!-- Lienzo Canvas de 800x500 px -->
        <canvas id="artCanvas" width="800" height="500"></canvas>
    </main>

    <a href="index.html" class="btn-back">← Volver al Menú Principal</a>

    <script src="canvas-script.js"></script>
</body>
</html>
