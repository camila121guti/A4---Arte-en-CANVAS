<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 | Arte en Canvas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Menú Principal -->
    <header class="header">
        <div class="logo">
            <span>CANVAS // A4</span>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="#carita-section">01. Carita Feliz</a></li>
                <li><a href="#animacion-section">02. Animación Synth</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero / Encabezado principal -->
    <section class="hero">
        <div class="hero-content">
            <h1>ACTIVIDAD A4: ARTE EN CANVAS</h1>
            <p>Exploración de formas geométricas y movimiento interactivo.</p>
        </div>
    </section>

    <!-- Contenedor Principal de Trabajos -->
    <main class="main-layout">

        <!-- PARTE 1: Carita Feliz (Cuadros y Rectángulos) -->
        <section id="carita-section" class="canvas-block">
            <div class="block-header">
                <h2>01 / Carita Feliz Geométrica</h2>
            </div>
            <div class="canvas-wrapper">
                <canvas id="happyFaceCanvas" width="500" height="500"></canvas>
            </div>
        </section>

        <!-- PARTE 2: Animación Dinámica Original -->
        <section id="animacion-section" class="canvas-block">
            <div class="block-header">
                <h2>02 / Animación Geométrica Synth</h2>
            </div>
            <div class="canvas-wrapper">
                <canvas id="animationCanvas" width="650" height="400"></canvas>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
